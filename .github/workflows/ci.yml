name: Reproducibility CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Tests and evidence validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Validate corpus, leakage, and protocol
        run: |
          python curation/validate_preserved_nonbib_corpus.py
          python experiments/validate_leakage.py
          python experiments/validate_paper_protocol.py

      - name: Regenerate paper evidence
        run: |
          python experiments/run_paper_benchmark.py
          python experiments/build_paper_data_profile.py
          python docs/generate_paper_tables.py

      - name: Require committed generated artifacts
        run: |
          git diff --exit-code -- \
            docs/paper_results_manifest.json \
            docs/paper_tables.tex \
            experiments/results/paper/paper_data_profile.json \
            experiments/results/paper/paper_results_snapshot.json \
            experiments/results/paper/PAPER_RESULTS_SNAPSHOT.md

  paper:
    name: Compile paper
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Compile with pdfLaTeX
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098
        with:
          root_file: paper.tex
          working_directory: docs
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Upload compiled paper
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dss-restoration-paper
          path: docs/paper.pdf
          if-no-files-found: error
